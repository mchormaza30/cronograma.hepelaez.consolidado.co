(function () {

    function markEditable() {

    // Credit badge with idle-fade. Hover devices only.
    function initChromeUI() {
        if (!matchMedia('(hover: hover)').matches) return;

        var credit = document.createElement('div');
        credit.className = 'design-ui-credit';
        credit.setAttribute('aria-hidden', 'true');
        credit.innerHTML = '\u{1F49C} by ClickUp Brain';
        document.body.appendChild(credit);

        var timer = null;
        var fade = function (out) { credit.style.opacity = out ? '0' : ''; };
        fade(true);
        var show = function () {
            fade(false);
            clearTimeout(timer);
            timer = setTimeout(function () { fade(true); }, 3000);
        };
        document.addEventListener('mousemove', show);
        show();
    }

    function init() {
        markEditable();
        initChromeUI();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();

      ["fundacion","Vacaciones Recreativas - clausuras en comunas","2026-07-25","Fundación Yo Estoy Con Vos","completado","Comunas 10, 13, 14, 15 y 16"],
      ["fundacion","Festival de la Familia - Corregimiento Golondrinas","2026-08-30","Fundación Yo Estoy Con Vos","pendiente","Corregimiento Golondrinas"],
      ["fundacion","Festival de la Familia - Comuna 2","2026-09-27","Fundación Yo Estoy Con Vos","pendiente","Parque del Amor"],
      ["fundacion","Brigada Bienestar para Todos - Comuna 6","2026-10-17","Fundación Yo Estoy Con Vos","pendiente","Integrar servicios institucionales y oferta social"],
      ["fundacion","Festival de la Familia - Comuna 19","2026-10-25","Fundación Yo Estoy Con Vos","pendiente","Unidad Jaime Aparicio"],
      ["fundacion","Festival de la Familia - Comuna 18","2026-11-08","Fundación Yo Estoy Con Vos","pendiente","Los Chorros"],
      ["fundacion","Festival de la Familia - Corregimiento Pichindé","2026-11-29","Fundación Yo Estoy Con Vos","pendiente","Corregimiento Pichindé"],
      ["fundacion","Brigada Bienestar para Todos - Comuna 6","2026-12-05","Fundación Yo Estoy Con Vos","pendiente","Integrar servicios institucionales y oferta social"],
      ["fundacion","Festival de la Familia - Comuna 16","2026-12-13","Fundación Yo Estoy Con Vos","pendiente","Mariano Ramos"],
      ["fundacion","Invitación y entrega de Bonos Go-Prende","2026-04-18","Fundación Yo Estoy Con Vos","completado","Lugar: Fundación Yo Estoy Con Vos"],
      ["fundacion","Celebración día del niño","2026-05-08","Fundación Yo Estoy Con Vos","completado","Lugar: Unidad Recreativa El Vallado"],
      ["fundacion","Reunión Gestores Sociales - Socialización de emprendimientos","2026-05-18","Fundación Yo Estoy Con Vos","completado","Lugar: Fundación Yo Estoy Con Vos"],
      ["fundacion","Actividades para niños de las Gestoras","2026-05-25","Fundación Yo Estoy Con Vos","completado","Lugar: Mall Plaza"],
      ["fundacion","Reunión Instructores - Retroalimentación de talleres","2026-06-12","Fundación Yo Estoy Con Vos","completado","Lugar: Comuna 16"],
      ["fundacion","Formación en manipulación de alimentos","2026-07-02","Fundación Yo Estoy Con Vos","completado","Lugar: Fundación Yo Estoy Con Vos"],
      ["fundacion","Reunión de emprendedores - Fortalecimiento de temas para emprendedores","2026-06-24","Fundación Yo Estoy Con Vos","completado","Lugar: Fundación Yo Estoy Con Vos"]
    ];

    let activities = [];
    let filter = "all";
    let editingId = null;
    let nextId = Date.now();
    let seeded = false;

    const $ = id => document.getElementById(id);
    const ejeConfig = key => EJES.find(e => e.key === key) || { label: key, color: "var(--muted)" };
    const normalize = value => String(value || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    const escapeHtml = value => String(value ?? "").replace(/[&<>'"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[ch]));

    function setConnection(type, text) { $("connection").className = "connection " + type; $("connection").lastElementChild.textContent = text; }
    function formatDate(value) { if (!value) return "Segundo semestre 2026"; const date = new Date(value + "T00:00:00"); return Number.isNaN(date.getTime()) ? "Segundo semestre 2026" : date.toLocaleDateString("es-CO", { day: "2-digit", month: "short", year: "numeric" }); }
    function weekNumber(date) { const first = new Date(date.getFullYear(), 0, 1); return Math.ceil(((date - first) / 86400000 + first.getDay() + 1) / 7); }
    function statusLabel(value) { return value === "completado" ? "Completado" : value === "proceso" ? "En proceso" : value === "cancelado" ? "Cancelado" : "Pendiente"; }
    function statusClass(value) { return value === "completado" ? "done" : value === "proceso" ? "progress" : value === "cancelado" ? "cancel" : "pending"; }

    function seedObjects() {
      const now = Date.now();
      return Object.fromEntries(SEED_ACTIVITIES.map((item, index) => {
        const id = now + index;
        return [String(id), { id, eje: item[0], nombre: item[1], fechaFin: item[2], responsable: item[3], estado: item[4], obs: item[5] }];
      }));
    }

    async function seedIfEmpty(snapshot) {
      if (seeded || snapshot.exists()) return;
      seeded = true;
      await activitiesRef.set(seedObjects());
    }

    function render() {
      const now = new Date();
      $("today").textContent = now.toLocaleDateString("es-CO", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
      $("week").textContent = `Semana ${weekNumber(now)} · ${now.getFullYear()}`;

      const total = activities.length;
      const complete = activities.filter(a => a.estado === "completado").length;
      const inProgress = activities.filter(a => a.estado === "proceso").length;
      const pending = activities.filter(a => a.estado === "pendiente").length;
      const progress = total ? Math.round(complete / total * 100) : 0;
      const activeEjes = EJES.filter(e => activities.some(a => a.eje === e.key)).length;

      $("stats").innerHTML = `
        <div class="stat"><label>Total actividades</label><b>${total}</b><span>${activeEjes} ejes activos</span></div>
        <div class="stat"><label>Completadas</label><b style="color:var(--success)">${complete}</b><span>${progress}% del total</span></div>
        <div class="stat"><label>En proceso</label><b style="color:var(--info)">${inProgress}</b><span>${total ? Math.round(inProgress / total * 100) : 0}%</span></div>
        <div class="stat"><label>Pendientes</label><b style="color:var(--warning)">${pending}</b><span>${total ? Math.round(pending / total * 100) : 0}%</span></div>
        <div class="stat"><label>Avance general</label><b>${progress}%</b><span>${progress >= 60 ? "Buen ritmo" : progress >= 30 ? "Avanzando" : "Requiere impulso"}</span></div>`;

      $("ejes").innerHTML = EJES.filter(e => activities.some(a => a.eje === e.key)).map(e => {
        const items = activities.filter(a => a.eje === e.key);
        const completeCount = items.filter(a => a.estado === "completado").length;
        const progressCount = items.filter(a => a.estado === "proceso").length;
        const pendingCount = items.filter(a => a.estado === "pendiente").length;
        const percent = items.length ? Math.round(completeCount / items.length * 100) : 0;
        return `<article class="eje"><div class="eje-top"><div class="eje-name"><i class="dot" style="background:${e.color}"></i>${escapeHtml(e.label)}</div><div class="pct" style="color:${e.color}">${percent}%</div></div><div class="bar"><div class="fill" style="width:${percent}%;background:${e.color}"></div></div><div class="eje-meta"><span><strong>${completeCount}</strong> compl.</span><span><strong>${progressCount}</strong> proceso</span><span><strong>${pendingCount}</strong> pend.</span><span><strong>${items.length}</strong> total</span></div></article>`;
      }).join("");

      $("filters").innerHTML = `<button class="chip ${filter === "all" ? "active" : ""}" data-filter="all">Todos</button>` + EJES.filter(e => activities.some(a => a.eje === e.key)).map(e => `<button class="chip ${filter === e.key ? "active" : ""}" data-filter="${e.key}">${escapeHtml(e.label)}</button>`).join("");
      document.querySelectorAll("[data-filter]").forEach(button => button.onclick = () => { filter = button.dataset.filter; render(); });

      const from = $("from").value;
      const to = $("to").value;
      const term = normalize($("search").value);
      let list = filter === "all" ? [...activities] : activities.filter(a => a.eje === filter);
      list = list.filter(a => (!from || (a.fechaFin && a.fechaFin >= from)) && (!to || (a.fechaFin && a.fechaFin <= to)) && (!term || normalize(`${a.nombre} ${a.responsable} ${a.obs}`).includes(term)));
      list.sort((a, b) => (a.fechaFin || "9999").localeCompare(b.fechaFin || "9999"));

      if (!list.length) {
        $("rows").innerHTML = `<tr><td colspan="7" class="empty">No hay actividades para este filtro.</td></tr>`;
        return;
      }

      $("rows").innerHTML = list.map(a => {
        const eje = ejeConfig(a.eje);
        const safeId = Number(a.id);
        return `<tr><td style="color:${eje.color};font-weight:800">${escapeHtml(eje.label)}</td><td class="activity">${escapeHtml(a.nombre)}</td><td>${escapeHtml(formatDate(a.fechaFin))}</td><td>${escapeHtml(a.responsable)}</td><td><span class="tag ${statusClass(a.estado)}">${statusLabel(a.estado)}</span></td><td class="obs">${escapeHtml(a.obs)}</td><td><div class="row-actions"><button data-edit="${safeId}">Editar</button><button class="delete" data-delete="${safeId}">Eliminar</button></div></td></tr>`;
      }).join("");

      document.querySelectorAll("[data-edit]").forEach(button => button.onclick = () => openEditor(Number(button.dataset.edit)));
      document.querySelectorAll("[data-delete]").forEach(button => button.onclick = () => deleteActivity(Number(button.dataset.delete)));
    }

    function openEditor(id = null) {
      const item = id === null ? null : activities.find(a => Number(a.id) === id);
      editingId = item ? Number(item.id) : null;
      $("editor-title").textContent = item ? "Editar actividad" : "Agregar actividad";
      $("f-eje").value = item?.eje || "fe";
      $("f-estado").value = item?.estado || "pendiente";
      $("f-nombre").value = item?.nombre || "";
      $("f-fecha").value = item?.fechaFin || "";
      $("f-resp").value = item?.responsable || "";
      $("f-obs").value = item?.obs || "";
      $("editor").classList.add("open");
      $("f-nombre").focus();
    }

    function closeEditor() { $("editor").classList.remove("open"); editingId = null; }

    async function saveActivity() {
      const nombre = $("f-nombre").value.trim();
      if (!nombre) { $("f-nombre").focus(); return; }
      const id = editingId || Date.now();
      const item = { id, eje: $("f-eje").value, nombre, fechaFin: $("f-fecha").value, responsable: $("f-resp").value.trim(), estado: $("f-estado").value, obs: $("f-obs").value.trim() };
      try { await activitiesRef.child(String(id)).set(item); closeEditor(); }
      catch (error) { console.error(error); alert("No se pudo guardar. Revisa las reglas de Firebase."); }
    }

    async function deleteActivity(id) {
      if (!confirm("¿Eliminar esta actividad para todos?")) return;
      try { await activitiesRef.child(String(id)).remove(); }
      catch (error) { console.error(error); alert("No se pudo eliminar. Revisa las reglas de Firebase."); }
    }

    function excelDateToISO(value) {
      if (!value) return "";
      if (typeof value === "number") return new Date(Math.round((value - 25569) * 86400 * 1000)).toISOString().slice(0, 10);
      const text = String(value).trim();
      if (/^\d{4}-\d{2}-\d{2}/.test(text)) return text.slice(0, 10);
      const match = text.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
      return match ? `${match[3]}-${match[2].padStart(2, "0")}-${match[1].padStart(2, "0")}` : "";
    }

    function parseStatus(value) {
      const text = normalize(value);
      if (text.includes("complet") || text.includes("listo") || text.includes("done")) return "completado";
      if (text.includes("proceso") || text.includes("ejecuci") || text.includes("progress")) return "proceso";
      if (text.includes("cancel")) return "cancelado";
      return "pendiente";
    }

    function detectEje(name) {
      const text = normalize(name);
      return Object.entries(KEYWORDS).find(([, words]) => words.some(word => text.includes(normalize(word))))?.[0] || null;
    }

    function readSheet(sheet, name) {
      const eje = detectEje(name);
      if (!eje) return [];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
      const header = rows.findIndex(row => row.some(cell => { const text = normalize(cell); return text.includes("actividad") || text.includes("accion"); }));
      if (header < 0) return [];
      return rows.slice(header + 1).map(row => ({
        eje,
        nombre: String(row[1] || row[0] || "").trim(),
        fechaFin: excelDateToISO(row[4] || row[3]),
        responsable: String(row[5] || row[4] || "").trim(),
        estado: parseStatus(row[7] || row[6]),
        obs: String(row[8] || "").trim()
      })).filter(item => item.nombre.length > 2 && !normalize(item.nombre).includes("total registrada"));
    }

    async function importFiles(files) {
      try {
        for (const file of files) {
          const workbook = XLSX.read(await file.arrayBuffer(), { type: "array" });
          const grouped = {};
          workbook.SheetNames.forEach(name => { if (!['INSTRUCCIONES', 'RESUMEN GENERAL'].includes(name)) { const items = readSheet(workbook.Sheets[name], name); if (items.length) grouped[items[0].eje] = items; } });
          for (const [eje, items] of Object.entries(grouped)) {
            const updates = {};
            activities.filter(item => item.eje === eje).forEach(item => { updates[item.id] = null; });
            items.forEach((item, index) => { const id = Date.now() + index; updates[id] = { ...item, id }; });
            await activitiesRef.update(updates);
          }
        }
      } catch (error) { console.error(error); alert("No se pudo importar el Excel. Revisa el formato."); }
    }

    $("add").onclick = () => openEditor();
    $("cancel").onclick = closeEditor;
    $("save").onclick = saveActivity;
    $("editor").onclick = event => { if (event.target.id === "editor") closeEditor(); };
    document.onkeydown = event => { if (event.key === "Escape") closeEditor(); };
    ["from", "to", "search"].forEach(id => $(id).oninput = render);
    $("clear").onclick = () => { $("from").value = ""; $("to").value = ""; $("search").value = ""; render(); };
    $("theme").onclick = () => { document.documentElement.dataset.theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; };
    $("f-eje").innerHTML = EJES.map(e => `<option value="${e.key}">${escapeHtml(e.label)}</option>`).join("");

    $("drop").onclick = () => $("file").click();
    $("file").onchange = event => { if (event.target.files.length) importFiles([...event.target.files]); event.target.value = ""; };
    $("drop").ondragover = event => { event.preventDefault(); $("drop").classList.add("dragging"); };
    $("drop").ondragleave = () => $("drop").classList.remove("dragging");
    $("drop").ondrop = event => { event.preventDefault(); $("drop").classList.remove("dragging"); const files = [...event.dataTransfer.files].filter(file => /\.xlsx?$/i.test(file.name)); if (files.length) importFiles(files); };

    activitiesRef.on("value", async snapshot => {
      await seedIfEmpty(snapshot);
      const data = snapshot.val() || {};
      activities = Array.isArray(data) ? data.filter(Boolean) : Object.values(data);
      nextId = Math.max(Date.now(), ...activities.map(item => Number(item.id) || 0) + 1);
      setConnection("ok", "Sincronizado");
      render();
    }, error => { console.error(error); setConnection("error", "Error de conexión"); render(); });
  </script>
</body>
</html>
